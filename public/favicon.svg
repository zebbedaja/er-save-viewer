<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b21"/>
      <stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#e8bc55" stop-opacity="0.55"/>
      <stop offset="0.8" stop-color="#b07f2a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#b07f2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4a53f" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#d4a53f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7ae"/>
      <stop offset="0.5" stop-color="#e3b855"/>
      <stop offset="1" stop-color="#a97f2e"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Hintergrund -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#halo)"/>
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="url(#gold)" stroke-width="7" opacity="0.8"/>

  <!-- Leuchtender Runen-Orb -->
  <circle cx="256" cy="248" r="200" fill="url(#orb)"/>
  <circle cx="256" cy="248" r="128" fill="none" stroke="#f2cf7e" stroke-width="5" opacity="0.5" filter="url(#soft)"/>
  <circle cx="256" cy="248" r="128" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.9"/>
  <circle cx="256" cy="248" r="112" fill="none" stroke="#8f6c26" stroke-width="3" opacity="0.6"/>

  <!-- Original-Runenglyphe (Save/Fortschritt-Stab) -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Glow-Ebene -->
    <g stroke="#ffe9a8" stroke-width="26" opacity="0.55" filter="url(#soft)">
      <line x1="256" y1="152" x2="256" y2="344"/>
      <path d="M256 184 L322 232"/>
      <path d="M256 184 L190 232"/>
      <path d="M256 300 L316 254"/>
      <path d="M200 268 L232 300 L256 276"/>
    </g>
    <!-- Glyphe -->
    <g stroke="url(#gold)" stroke-width="18">
      <line x1="256" y1="152" x2="256" y2="344"/>
      <path d="M256 184 L322 232"/>
      <path d="M256 184 L190 232"/>
      <path d="M256 300 L316 254"/>
      <!-- integrierter Haken: Fortschritt -->
      <path d="M200 268 L232 300 L256 276"/>
    </g>
  </g>

  <!-- Funken / Rune-Partikel -->
  <g fill="#f5d789">
    <circle cx="130" cy="330" r="7" opacity="0.9"/>
    <circle cx="112" cy="290" r="4" opacity="0.6"/>
    <circle cx="382" cy="168" r="7" opacity="0.9"/>
    <circle cx="402" cy="208" r="4" opacity="0.6"/>
    <circle cx="356" cy="352" r="5" opacity="0.7"/>
    <circle cx="156" cy="158" r="5" opacity="0.7"/>
  </g>
</svg>
